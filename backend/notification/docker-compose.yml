services:
  backend:
    image: mfu-tidloop-backend:latest
    ports:
      - "8081:8081"
    environment:
      IPADDRESS: ${IPADDRESS}

  frontend:
    image: mfu-tidloop-frontend:latest
    ports:
      - "3000:3000"

  zookeeper:
    image: quay.io/debezium/zookeeper:2.7
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"

  kafka:
    image: quay.io/debezium/kafka:2.7
    ports:
      - "9092:9092"
    links:
      - zookeeper
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${IPADDRESS}:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  connect:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: "my_connect_configs"
      OFFSET_STORAGE_TOPIC: "my_connect_offsets"
      STATUS_STORAGE_TOPIC: "my_connect_statuses"
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      POSTGRES_HOST: ${IPADDRESS}
      POSTGRES_PORT: 5432
      POSTGRES_USER: Postgres
      POSTGRES_PASSWORD: user1234

  register-connector:
    image: curlimages/curl:latest
    depends_on:
      - connect
    entrypoint: >
      sh -c "
      echo 'Waiting for Kafka Connect to be ready...' &&
      sleep 10 &&
      curl -i -X POST -H 'Accept:application/json' -H 'Content-Type:application/json' http://connect:8083/connectors/ -d '{
        \"name\": \"inventory-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"tasks.max\": \"1\",
          \"database.hostname\": \"host.docker.internal\",
          \"database.port\": \"5432\",
          \"database.user\": \"postgres\",
          \"database.password\": \"user1234\",
          \"database.dbname\": \"InventoryManagement\",
          \"database.server.name\": \"dbserver1\",
          \"plugin.name\": \"pgoutput\",
          \"slot.name\": \"inventory_slot\",
          \"topic.prefix\": \"dbserver1\",
          \"schema.include.list\": \"public\",
          \"schema.history.internal.kafka.bootstrap.servers\": \"kafka:9092\",
          \"schema.history.internal.kafka.topic\": \"schemahistory.inventory\"
        }
      }'
      "
    
  redpanda:
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: host.docker.internal:9092
